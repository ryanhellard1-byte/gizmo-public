name: D3 Phase184 R0 commissioning judge

on:
  push:
    branches: [phase184-r0-commissioning-judge]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase184-judge-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install analysis dependencies
        run: python3 -m pip install --disable-pip-version-check numpy scipy
      - name: Compile Phase184 stack
        run: |
          python3 -m py_compile d3/production/phase184_machine_evidence.py
          python3 -m py_compile d3/production/phase184_safe_resume.py
          python3 -m py_compile d3/production/phase184_r0_commissioning_judge.py
      - name: Verify frozen Phase184 source contract
        run: python3 d3/production/phase184_machine_evidence.py source-check --source-repo "$PWD"
      - name: Attack strict runtime gate boundaries
        run: python3 d3/production/phase184_r0_commissioning_judge.py self-test
      - name: Verify production renderer freezes full-energy cadence and defaults
        run: |
          python3 d3/production/phase172_lock.py --write /tmp/phase172_manifest.csv >/tmp/p184-lock.json
          mkdir -p /tmp/p184-ics /tmp/p184-runs
          touch /tmp/p184-ics/M11_N600000_seed165001_mr3_canonical.dat
          python3 d3/production/phase172_render_run.py \
            --manifest /tmp/phase172_manifest.csv --row-index 0 \
            --ic-root /tmp/p184-ics --run-root /tmp/p184-runs
          EXPECT=$(python3 - <<'PY'
          print(f"{0.25/0.9777923542981722:.17g}")
          PY
          )
          P=/tmp/p184-runs/PH165-0001/params.txt
          grep -q "^TimeBetStatistics[[:space:]]\+${EXPECT}$" "$P"
          grep -q '^ErrTolIntAccuracy[[:space:]]\+0.02$' "$P"
          grep -q '^ErrTolTheta[[:space:]]\+0.7$' "$P"
          grep -q '^CourantFac[[:space:]]\+0.4$' "$P"
          grep -q '^ErrTolForceAcc[[:space:]]\+0.0025$' "$P"
          grep -q '^MaxRMSDisplacementFac[[:space:]]\+0.25$' "$P"
          grep -q '^MaxNumNgbDeviation[[:space:]]\+0.05$' "$P"
          grep -q '^DEVELOPER_MODE$' d3/Config_d3_ci.sh
          grep -q '^DEVELOPER_MODE$' d3/Config_d3_production.sh
          grep -q '^COMPUTE_POTENTIAL_ENERGY$' d3/Config_d3_ci.sh
          grep -q '^COMPUTE_POTENTIAL_ENERGY$' d3/Config_d3_production.sh

  phase184-machine-equivalence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GIZMO build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential openmpi-bin libopenmpi-dev libgsl-dev libhdf5-openmpi-dev libfftw3-dev
          python3 -m pip install --disable-pip-version-check numpy scipy
      - name: Build-attest full-energy evidence and control binaries
        shell: bash
        run: |
          set -euo pipefail
          python3 d3/production/phase184_machine_evidence.py build-attest \
            --source-repo "$PWD" \
            --systype PopOS \
            --jobs 2 \
            --mpi-prefix "mpirun --allow-run-as-root -np 2" \
            --work-dir /tmp/p184-machine \
            --binary-dir /tmp/p184-bin \
            --output /tmp/p184-attestation.json
          python3 d3/production/phase184_machine_evidence.py verify \
            --attestation /tmp/p184-attestation.json \
            --executable /tmp/p184-bin/GIZMO_D3_EVIDENCE
      - name: Require repeated real gravitational-energy telemetry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.load(open('/tmp/p184-attestation.json'))
          assert a['canonical_source_commit']=='2aafd369d2f26eef0bcc3cd8fcd6d4a4c1a7ed53'
          assert a['phase184_energy_define']=='COMPUTE_POTENTIAL_ENERGY'
          assert a['phase184_developer_define']=='DEVELOPER_MODE'
          assert a['phase184_energy_statistics_interval_Gyr']==0.25
          assert a['phase184_repeated_statistics_smoke'] is True
          assert a['phase184_developer_mode_defaults_frozen'] is True
          assert a['phase184_R0_AGS_neighbors']==64
          assert a['phase184_R0_AGS_max_deviation']==0.1
          assert a['equivalence']['d3_full']['status']=='PASS'
          assert a['equivalence']['standard_equal_label']['status']=='PASS'
          energy=list(Path('/tmp/p184-machine').rglob('energy.txt'))
          assert len(energy)==4, energy
          for p in energy:
              rows=[[float(x) for x in line.split()] for line in p.read_text().splitlines() if line.strip()]
              assert len(rows)>=4, (p,len(rows))
              assert any(abs(r[2])>0 for r in rows), p
              assert rows[-1][0] > rows[0][0], p
          print('Phase184 repeated full-energy machine-equivalence PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase184-machine-attestation
          path: |
            /tmp/p184-attestation.json
            /tmp/p184-bin/GIZMO_D3_EVIDENCE
            /tmp/p184-bin/GIZMO_D3_CONTROL
          if-no-files-found: error
