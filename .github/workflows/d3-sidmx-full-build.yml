name: D3 SIDMx Full GIZMO Build Attempt

on:
  push:
    branches:
      - d3-sidmx-use-gizmo
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  d3-sidmx-full-gizmo-build:
    name: Attempt full GIZMO build with DM_SIDM + D3_SIDMX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            mpich \
            libmpich-dev \
            libgsl-dev \
            libfftw3-dev \
            hdf5-tools \
            libhdf5-dev \
            libhdf5-mpich-dev \
            pkg-config

      - name: Select MPICH toolchain
        run: |
          echo '--- MPI wrappers before selection ---'
          which mpicc || true
          which mpif90 || true
          mpicc --version || true
          mpif90 --version || true
          if [ -x /usr/bin/mpicc.mpich ]; then
            echo 'Using MPICH compiler wrappers'
            echo "CC=/usr/bin/mpicc.mpich" >> "$GITHUB_ENV"
            echo "FC=/usr/bin/mpif90.mpich" >> "$GITHUB_ENV"
            echo "MPICC=/usr/bin/mpicc.mpich" >> "$GITHUB_ENV"
            echo "MPIF90=/usr/bin/mpif90.mpich" >> "$GITHUB_ENV"
            sudo update-alternatives --set mpi /usr/bin/mpicc.mpich || true
            sudo update-alternatives --set mpirun /usr/bin/mpirun.mpich || true
          fi
          echo '--- MPI wrappers after selection ---'
          which mpicc || true
          which mpif90 || true
          mpicc --version || true
          mpif90 --version || true

      - name: Locate and export HDF5 paths
        run: |
          echo '--- hdf5 headers ---'
          find /usr/include -path '*hdf5*' -name hdf5.h -print || true
          echo '--- pkg-config hdf5 ---'
          pkg-config --cflags --libs hdf5 || true
          echo '--- pkg-config hdf5-mpich ---'
          pkg-config --cflags --libs hdf5-mpich || true

          if [ -d /usr/include/hdf5/mpich ]; then
            echo 'Using MPICH HDF5 paths'
            echo "CPATH=/usr/include/hdf5/mpich:${CPATH:-}" >> "$GITHUB_ENV"
            echo "C_INCLUDE_PATH=/usr/include/hdf5/mpich:${C_INCLUDE_PATH:-}" >> "$GITHUB_ENV"
            echo "LIBRARY_PATH=/usr/lib/x86_64-linux-gnu/hdf5/mpich:${LIBRARY_PATH:-}" >> "$GITHUB_ENV"
            echo "LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu/hdf5/mpich:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
            echo "HDF5INCL=-I/usr/include/hdf5/mpich -I/usr/lib/x86_64-linux-gnu/mpich/include -DH5_USE_16_API" >> "$GITHUB_ENV"
            echo "HDF5LIB=-L/usr/lib/x86_64-linux-gnu/hdf5/mpich -lhdf5 -lz" >> "$GITHUB_ENV"
          elif [ -d /usr/include/hdf5/serial ]; then
            echo 'Using serial HDF5 paths'
            echo "CPATH=/usr/include/hdf5/serial:${CPATH:-}" >> "$GITHUB_ENV"
            echo "C_INCLUDE_PATH=/usr/include/hdf5/serial:${C_INCLUDE_PATH:-}" >> "$GITHUB_ENV"
            echo "LIBRARY_PATH=/usr/lib/x86_64-linux-gnu/hdf5/serial:${LIBRARY_PATH:-}" >> "$GITHUB_ENV"
            echo "LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu/hdf5/serial:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
            echo "HDF5INCL=-I/usr/include/hdf5/serial -DH5_USE_16_API" >> "$GITHUB_ENV"
            echo "HDF5LIB=-L/usr/lib/x86_64-linux-gnu/hdf5/serial -lhdf5 -lz" >> "$GITHUB_ENV"
          fi

      - name: Prepare D3 SIDMx build config
        run: |
          cp Template_Config.sh Config.sh
          printf '\n# --- D3 SIDMx CI build attempt ---\n' >> Config.sh
          # GIZMO expects DM_SIDM to be a particle-type bitmask, not a blank define.
          # Type 2 -> H gives 1<<2 = 4. Type 3 -> L gives 1<<3 = 8. H+L mask = 12.
          printf 'DM_SIDM=12\n' >> Config.sh
          printf 'D3_SIDMX\n' >> Config.sh
          # GIZMO 2022 uses the legacy HDF5 1.6 call signatures. Modern HDF5 still
          # provides those signatures behind this compatibility macro.
          printf 'H5_USE_16_API\n' >> Config.sh
          printf 'SELFGRAVITY_OFF\n' >> Config.sh
          printf 'BOX_PERIODIC\n' >> Config.sh
          cat > Makefile.systype <<'EOF'
          SYSTYPE="Ubuntu"
          EOF
          echo '--- D3 SIDMx Config tail ---'
          tail -n 24 Config.sh
          echo '--- Makefile.systype ---'
          cat Makefile.systype
          echo '--- Build env ---'
          echo "CC=${CC:-}"
          echo "FC=${FC:-}"
          echo "MPICC=${MPICC:-}"
          echo "MPIF90=${MPIF90:-}"
          echo "HDF5INCL=${HDF5INCL:-}"
          echo "HDF5LIB=${HDF5LIB:-}"
          echo "CPATH=${CPATH:-}"
          echo "C_INCLUDE_PATH=${C_INCLUDE_PATH:-}"
          echo "LIBRARY_PATH=${LIBRARY_PATH:-}"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}"

      - name: Full GIZMO compile attempt
        run: |
          export CC="${CC:-/usr/bin/mpicc.mpich}"
          export FC="${FC:-/usr/bin/mpif90.mpich}"
          export HDF5INCL="${HDF5INCL:--I/usr/include/hdf5/mpich -I/usr/lib/x86_64-linux-gnu/mpich/include -DH5_USE_16_API}"
          export HDF5LIB="${HDF5LIB:--L/usr/lib/x86_64-linux-gnu/hdf5/mpich -lhdf5 -lz}"
          echo "Using HDF5INCL=$HDF5INCL"
          echo "Using HDF5LIB=$HDF5LIB"
          make clean || true
          make -j2 EXEC=GIZMO_D3SIDMX_CI HDF5INCL="$HDF5INCL" HDF5LIB="$HDF5LIB"

      - name: Verify executable exists
        run: |
          test -x ./GIZMO_D3SIDMX_CI
          sha256sum ./GIZMO_D3SIDMX_CI

      - name: Run D3 pair law inside actual GIZMO executable
        env:
          UCX_TLS: self,tcp
          HYDRA_IFACE: lo
        run: |
          echo "Forcing UCX transports: $UCX_TLS"
          mpirun -np 1 ./GIZMO_D3SIDMX_CI --d3-pair-selftest
