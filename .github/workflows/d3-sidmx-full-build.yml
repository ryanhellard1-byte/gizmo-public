name: D3 SIDMx Full GIZMO Build Attempt

on:
  push:
    branches:
      - d3-sidmx-use-gizmo
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  d3-sidmx-full-gizmo-build:
    name: Attempt full GIZMO build with DM_SIDM + D3_SIDMX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            openmpi-bin \
            libopenmpi-dev \
            libgsl-dev \
            libfftw3-dev \
            hdf5-tools \
            libhdf5-dev \
            libhdf5-openmpi-dev \
            pkg-config

      - name: Locate and export HDF5 paths
        run: |
          echo '--- hdf5 headers ---'
          find /usr/include -path '*hdf5*' -name hdf5.h -print || true
          echo '--- pkg-config hdf5 ---'
          pkg-config --cflags --libs hdf5 || true
          echo '--- pkg-config hdf5-openmpi ---'
          pkg-config --cflags --libs hdf5-openmpi || true

          if [ -d /usr/include/hdf5/openmpi ]; then
            echo 'Using OpenMPI HDF5 paths'
            echo "CPATH=/usr/include/hdf5/openmpi:${CPATH:-}" >> "$GITHUB_ENV"
            echo "C_INCLUDE_PATH=/usr/include/hdf5/openmpi:${C_INCLUDE_PATH:-}" >> "$GITHUB_ENV"
            echo "LIBRARY_PATH=/usr/lib/x86_64-linux-gnu/hdf5/openmpi:${LIBRARY_PATH:-}" >> "$GITHUB_ENV"
            echo "LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu/hdf5/openmpi:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          else
            echo 'Using serial HDF5 paths'
            echo "CPATH=/usr/include/hdf5/serial:${CPATH:-}" >> "$GITHUB_ENV"
            echo "C_INCLUDE_PATH=/usr/include/hdf5/serial:${C_INCLUDE_PATH:-}" >> "$GITHUB_ENV"
            echo "LIBRARY_PATH=/usr/lib/x86_64-linux-gnu/hdf5/serial:${LIBRARY_PATH:-}" >> "$GITHUB_ENV"
            echo "LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu/hdf5/serial:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          fi

      - name: Prepare D3 SIDMx build config
        run: |
          cp Template_Config.sh Config.sh
          printf '\n# --- D3 SIDMx CI build attempt ---\n' >> Config.sh
          printf 'DM_SIDM\n' >> Config.sh
          printf 'D3_SIDMX\n' >> Config.sh
          printf 'SELFGRAVITY_OFF\n' >> Config.sh
          printf 'BOX_PERIODIC\n' >> Config.sh
          cat > Makefile.systype <<'EOF'
          SYSTYPE="Ubuntu"
          EOF
          echo '--- D3 SIDMx Config tail ---'
          tail -n 20 Config.sh
          echo '--- Makefile.systype ---'
          cat Makefile.systype
          echo '--- Build env ---'
          echo "CPATH=${CPATH:-}"
          echo "C_INCLUDE_PATH=${C_INCLUDE_PATH:-}"
          echo "LIBRARY_PATH=${LIBRARY_PATH:-}"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}"

      - name: Full GIZMO compile attempt
        run: |
          make clean || true
          make -j2 EXEC=GIZMO_D3SIDMX_CI

      - name: Verify executable exists
        run: |
          test -x ./GIZMO_D3SIDMX_CI
          sha256sum ./GIZMO_D3SIDMX_CI
