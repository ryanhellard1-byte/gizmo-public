name: D3 audit-free production equivalence

on:
  push:
    branches: [master, phase174-validator-prod-equivalence]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-equivalence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GIZMO build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential openmpi-bin libopenmpi-dev libgsl-dev libhdf5-openmpi-dev libfftw3-dev
          python3 -m pip install --disable-pip-version-check numpy scipy

      - name: Build commissioning audit binary
        run: |
          sed -i 's/^SYSTYPE="Frontera"/SYSTYPE="PopOS"/' Makefile.systype
          cp d3/Config_d3_ci.sh Config.sh
          make -j2 CONFIG=Config.sh EXEC=GIZMO_D3_AUDIT
          sha256sum GIZMO_D3_AUDIT | tee /tmp/GIZMO_D3_AUDIT.sha256

      - name: Build clean audit-free production binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gizmo-prod-src
          git archive HEAD | tar -x -C /tmp/gizmo-prod-src
          cd /tmp/gizmo-prod-src
          sed -i 's/^SYSTYPE="Frontera"/SYSTYPE="PopOS"/' Makefile.systype
          cp d3/Config_d3_production.sh Config.sh
          make -j2 CONFIG=Config.sh EXEC=GIZMO_D3_PROD
          sha256sum GIZMO_D3_PROD | tee /tmp/GIZMO_D3_PROD.sha256
          cp GIZMO_D3_PROD "$GITHUB_WORKSPACE/GIZMO_D3_PROD"

      - name: Prove audit flag does not change D3 particle evolution
        shell: bash
        run: |
          set -euo pipefail
          trap 'rc=$?; if [[ $rc -ne 0 ]]; then echo "---- audit log tail ----"; tail -200 /tmp/d3_equiv_audit.log 2>/dev/null || true; echo "---- prod log tail ----"; tail -200 /tmp/d3_equiv_prod.log 2>/dev/null || true; fi; exit $rc' EXIT

          python3 d3/generate_d3_collision_cloud.py \
            --n-total 1000 --seed 173001 --radius-kpc 1.0 \
            --total-mass-msun 1.0e11 --stream-speed-kms 100 \
            --dispersion-kms 100 --output /tmp/D3_equiv_cloud.dat

          mkdir -p /tmp/d3_equiv_audit /tmp/d3_equiv_prod

          make_params () {
            local outdir="$1" outfile="$2"
            sed -e 's|@IC@|/tmp/D3_equiv_cloud.dat|g' \
                -e "s|@OUT@|${outdir}|g" \
                -e 's|@MODE@|-1|g' \
                -e 's|TimeOfFirstSnapshot         0.00010|TimeOfFirstSnapshot         0.00004|' \
                -e 's|TimeMax                      0.00010|TimeMax                      0.00004|' \
                -e 's|MaxSizeTimestep              0.00002|MaxSizeTimestep              0.000004|' \
                -e 's|BoxSize                      2000.0|BoxSize                      20.0|' \
                d3/params_m11_smoke.template > "$outfile"
          }

          make_params /tmp/d3_equiv_audit /tmp/d3_equiv_audit.params
          make_params /tmp/d3_equiv_prod /tmp/d3_equiv_prod.params

          ./GIZMO_D3_AUDIT /tmp/d3_equiv_audit.params 0 > /tmp/d3_equiv_audit.log 2>&1
          /tmp/gizmo-prod-src/GIZMO_D3_PROD /tmp/d3_equiv_prod.params 0 > /tmp/d3_equiv_prod.log 2>&1

          grep -Eq 'Simulation ends\.' /tmp/d3_equiv_audit.log
          grep -Eq 'Simulation ends\.' /tmp/d3_equiv_prod.log
          ! grep -Eq 'MPI_ABORT|ENDRUN issued' /tmp/d3_equiv_audit.log
          ! grep -Eq 'MPI_ABORT|ENDRUN issued' /tmp/d3_equiv_prod.log

          A="$(find /tmp/d3_equiv_audit -maxdepth 1 -type f -name 'snapshot*' | sort | tail -1)"
          P="$(find /tmp/d3_equiv_prod -maxdepth 1 -type f -name 'snapshot*' | sort | tail -1)"
          test -n "$A" && test -n "$P"
          export A P

          sha256sum "$A" | tee /tmp/audit_final_snapshot.sha256
          sha256sum "$P" | tee /tmp/prod_final_snapshot.sha256

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import struct

          def read_records(path: str):
              data = Path(path).read_bytes()
              out = []
              pos = 0
              while pos < len(data):
                  if pos + 4 > len(data):
                      raise SystemExit(f"truncated record prefix in {path}")
                  n = struct.unpack_from("<I", data, pos)[0]
                  pos += 4
                  payload = data[pos:pos+n]
                  pos += n
                  if pos + 4 > len(data):
                      raise SystemExit(f"truncated record suffix in {path}")
                  m = struct.unpack_from("<I", data, pos)[0]
                  pos += 4
                  if m != n:
                      raise SystemExit(f"record marker mismatch in {path}: {n} != {m}")
                  out.append(payload)
              return out

          audit = os.environ["A"]
          prod = os.environ["P"]
          ar = read_records(audit)
          pr = read_records(prod)
          if len(ar) < 4 or len(pr) < 4:
              raise SystemExit(f"too few GADGET records: audit={len(ar)} prod={len(pr)}")

          physical = [
              (1, "positions"),
              (2, "velocities"),
              (3, "particle_ids"),
          ]
          if len(ar) > 4 and len(pr) > 4:
              physical.append((4, "masses"))

          result = {
              "status": "PASS",
              "comparison": "GADGET format-1 physical record byte equality; header/provenance ignored",
              "audit_snapshot": audit,
              "production_snapshot": prod,
              "audit_snapshot_sha256": hashlib.sha256(Path(audit).read_bytes()).hexdigest(),
              "production_snapshot_sha256": hashlib.sha256(Path(prod).read_bytes()).hexdigest(),
              "audit_record_sizes": [len(x) for x in ar],
              "production_record_sizes": [len(x) for x in pr],
              "records_checked": [],
          }

          for idx, name in physical:
              if len(ar[idx]) != len(pr[idx]):
                  raise SystemExit(f"{name} record size mismatch: {len(ar[idx])} != {len(pr[idx])}")
              ah = hashlib.sha256(ar[idx]).hexdigest()
              ph = hashlib.sha256(pr[idx]).hexdigest()
              if ah != ph:
                  raise SystemExit(f"{name} physical record differs: {ah} != {ph}")
              result["records_checked"].append({"index": idx, "name": name, "bytes": len(ar[idx]), "sha256": ah})

          Path("/tmp/production_equivalence.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps(result, indent=2))
          PY

          printf 'PASS: audit-enabled and audit-free production binaries produce identical physical particle records\n' | tee /tmp/production_equivalence.txt

      - name: Record production provenance
        run: |
          sha256sum d3/Config_d3_production.sh | tee /tmp/Config_d3_production.sha256
          git rev-parse HEAD | tee /tmp/source_commit.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gizmo-d3-production-equivalence
          path: |
            GIZMO_D3_PROD
            /tmp/GIZMO_D3_PROD.sha256
            /tmp/GIZMO_D3_AUDIT.sha256
            /tmp/Config_d3_production.sha256
            /tmp/source_commit.txt
            /tmp/production_equivalence.txt
            /tmp/production_equivalence.json
            /tmp/audit_final_snapshot.sha256
            /tmp/prod_final_snapshot.sha256
            /tmp/d3_equiv_audit.log
            /tmp/d3_equiv_prod.log
            /tmp/d3_equiv_audit.params
            /tmp/d3_equiv_prod.params
            /tmp/D3_equiv_cloud.dat.json
          if-no-files-found: warn
