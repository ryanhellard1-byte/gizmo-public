name: D3 SIDMx GIZMO validation

on:
  push:
    branches: [d3-sidmx-gizmo]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d3-reference-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run frozen D3 microphysics gates
        run: python3 tests/test_sidmx_d3_reference.py
      - name: Install M11 IC generator dependencies
        run: python3 -m pip install --disable-pip-version-check numpy scipy
      - name: Generate deterministic M11 smoke IC twice
        run: |
          python3 d3/phase141_generate_m11_ic.py --n-total 200 --seed 126001 --taper 0.05 --output /tmp/M11_a.dat
          python3 d3/phase141_generate_m11_ic.py --n-total 200 --seed 126001 --taper 0.05 --output /tmp/M11_b.dat
          cmp /tmp/M11_a.dat /tmp/M11_b.dat
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/M11_a.dat.json'))
          assert a['n_H']==a['n_L']==100
          assert abs(a['mass_ratio']-3.0)<1e-12
          assert a['M200_Msun']==1.0e11
          assert abs(a['rho_s_Msun_kpc3']-6.89e6)<1e-6
          assert abs(a['r_s_kpc']-9.1)<1e-12
          print('M11 deterministic IC smoke gate PASS',a['snapshot_sha256'])
          PY

  gizmo-d3-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply deterministic small-N tree compatibility fix
        run: |
          git apply --check d3/gizmo_smalln_tree_fix.patch
          git apply d3/gizmo_smalln_tree_fix.patch
      - name: Install GIZMO build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential openmpi-bin libopenmpi-dev libgsl-dev libhdf5-openmpi-dev libfftw3-dev
          python3 -m pip install --disable-pip-version-check numpy scipy
      - name: Select Ubuntu-compatible GIZMO toolchain
        run: |
          sed -i 's/^SYSTYPE="Frontera"/SYSTYPE="PopOS"/' Makefile.systype
          cp d3/Config_d3_ci.sh Config.sh
      - name: Build D3-enabled GIZMO
        run: make -j2 CONFIG=Config.sh EXEC=GIZMO_D3
      - name: Run a real live-gravity SIDMx smoke evolution
        run: |
          set -euxo pipefail
          python3 d3/phase141_generate_m11_ic.py --n-total 400 --seed 126001 --taper 0.05 --output /tmp/M11_live.dat
          mkdir -p /tmp/d3_smoke_out
          sed -e 's|@IC@|/tmp/M11_live.dat|g' \
              -e 's|@OUT@|/tmp/d3_smoke_out|g' \
              -e 's|@MODE@|-2|g' \
              d3/params_m11_smoke.template > /tmp/d3_smoke.params
          ./GIZMO_D3 /tmp/d3_smoke.params 0 2>&1 | tee /tmp/d3_smoke.log
          test -s /tmp/d3_smoke.log
          test -n "$(find /tmp/d3_smoke_out -type f -print -quit)"
          python3 - <<'PY'
          import csv, glob
          files=glob.glob('/tmp/d3_smoke_out/sidmx_d3_audit.rank*.tsv')
          assert len(files)==1, f'audit files={files}'
          rows={r['channel']:r for r in csv.DictReader(open(files[0]),delimiter='\t')}
          print('AUDIT ROWS',rows)
          assert set(rows)=={'HH','LL','HL'}
          assert int(rows['HH']['pair_trials'])==0, rows['HH']
          assert int(rows['LL']['pair_trials'])==0, rows['LL']
          assert int(rows['HL']['pair_trials'])>0, rows['HL']
          assert float(rows['HL']['sum_probability'])>0, rows['HL']
          assert float(rows['HL']['limiter_fraction'])<0.005, rows['HL']
          print('LIVE GIZMO SIDMx AUDIT PASS',rows['HL'])
          PY
          cp /tmp/d3_smoke_out/sidmx_d3_audit.rank00000.tsv d3_smoke_audit.tsv
          cp /tmp/d3_smoke.log d3_smoke.log
      - name: Validate live D3 channel controls
        run: |
          set -euxo pipefail
          for spec in 'full:-1' 'hl_off:-3' 'null:-9'; do
            name=${spec%%:*}
            mode=${spec##*:}
            out=/tmp/d3_${name}_out
            mkdir -p "$out"
            sed -e "s|@IC@|/tmp/M11_live.dat|g" \
                -e "s|@OUT@|$out|g" \
                -e "s|@MODE@|$mode|g" \
                d3/params_m11_smoke.template > "/tmp/d3_${name}.params"
            ./GIZMO_D3 "/tmp/d3_${name}.params" 0 > "/tmp/d3_${name}.log" 2>&1
            cat "$out"/sidmx_d3_audit.rank*.tsv
          done
          python3 - <<'PY'
          import csv, pathlib
          def load(name):
              p=pathlib.Path(f'/tmp/d3_{name}_out/sidmx_d3_audit.rank00000.tsv')
              return {r['channel']:r for r in csv.DictReader(p.open(), delimiter='\t')}
          full=load('full')
          off=load('hl_off')
          null=load('null')
          for ch in ('HH','LL','HL'):
              assert int(full[ch]['pair_trials'])>0, (ch,full[ch])
              assert float(full[ch]['sum_probability'])>0, (ch,full[ch])
              assert float(full[ch]['limiter_fraction'])<0.005, (ch,full[ch])
          for ch in ('HH','LL'):
              assert int(off[ch]['pair_trials'])>0, (ch,off[ch])
              assert float(off[ch]['sum_probability'])>0, (ch,off[ch])
              assert float(off[ch]['limiter_fraction'])<0.005, (ch,off[ch])
          assert int(off['HL']['pair_trials'])==0, off['HL']
          assert float(off['HL']['sum_probability'])==0.0, off['HL']
          for ch in ('HH','LL','HL'):
              assert int(null[ch]['pair_trials'])==0, (ch,null[ch])
              assert float(null[ch]['sum_probability'])==0.0, (ch,null[ch])
              assert int(null[ch]['accepted_collisions'])==0, (ch,null[ch])
          print('LIVE D3 CHANNEL CONTROL MATRIX PASS')
          PY
          cp /tmp/d3_full_out/sidmx_d3_audit.rank00000.tsv d3_full_audit.tsv
          cp /tmp/d3_hl_off_out/sidmx_d3_audit.rank00000.tsv d3_hl_off_audit.tsv
          cp /tmp/d3_null_out/sidmx_d3_audit.rank00000.tsv d3_null_audit.tsv
      - name: Validate two-rank SIDMx decomposition invariance
        run: |
          set -euxo pipefail
          mkdir -p /tmp/d3_mpi2_out
          sed -e 's|@IC@|/tmp/M11_live.dat|g' \
              -e 's|@OUT@|/tmp/d3_mpi2_out|g' \
              -e 's|@MODE@|-2|g' \
              d3/params_m11_smoke.template > /tmp/d3_mpi2.params
          mpirun --oversubscribe -np 2 ./GIZMO_D3 /tmp/d3_mpi2.params 0 > /tmp/d3_mpi2.log 2>&1
          cat /tmp/d3_mpi2_out/sidmx_d3_audit.rank*.tsv
          python3 - <<'PY'
          import csv, glob, math
          def aggregate(paths):
              out={c:{'trials':0,'sumP':0.0,'accepted':0,'gt':0} for c in ('HH','LL','HL')}
              for p in paths:
                  for r in csv.DictReader(open(p), delimiter='\t'):
                      x=out[r['channel']]
                      x['trials'] += int(r['pair_trials'])
                      x['sumP'] += float(r['sum_probability'])
                      x['accepted'] += int(r['accepted_collisions'])
                      x['gt'] += int(r['prob_gt_0p2'])
              return out
          one=aggregate(['/tmp/d3_smoke_out/sidmx_d3_audit.rank00000.tsv'])
          mpi2_files=glob.glob('/tmp/d3_mpi2_out/sidmx_d3_audit.rank*.tsv')
          assert len(mpi2_files)==2, mpi2_files
          two=aggregate(mpi2_files)
          print('MPI1',one)
          print('MPI2',two)
          assert one['HH']['trials']==two['HH']['trials']==0, (one,two)
          assert one['LL']['trials']==two['LL']['trials']==0, (one,two)
          assert one['HL']['trials']==two['HL']['trials'], (one,two)
          assert one['HL']['accepted']==two['HL']['accepted'], (one,two)
          assert one['HL']['gt']==two['HL']['gt'], (one,two)
          assert math.isclose(one['HL']['sumP'],two['HL']['sumP'],rel_tol=1e-10,abs_tol=1e-15), (one,two)
          print('LIVE SIDMx MPI DECOMPOSITION INVARIANCE PASS')
          PY
          cp /tmp/d3_mpi2.log d3_mpi2.log
          for f in /tmp/d3_mpi2_out/sidmx_d3_audit.rank*.tsv; do cp "$f" "d3_mpi2_${f##*/}"; done
      - name: Record executable checksum
        run: |
          test -x GIZMO_D3
          sha256sum GIZMO_D3 | tee GIZMO_D3.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: gizmo-d3-build
          path: |
            GIZMO_D3
            GIZMO_D3.sha256
            GIZMO_config.h
            d3_smoke_audit.tsv
            d3_smoke.log
            d3_full_audit.tsv
            d3_hl_off_audit.tsv
            d3_null_audit.tsv
            d3_mpi2.log
            d3_mpi2_sidmx_d3_audit.rank*.tsv
          if-no-files-found: error
