name: D3 SIDMx GIZMO validation

on:
  push:
    branches: [d3-sidmx-gizmo, d3-live-smoke-real-fix]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: d3-sidmx-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  d3-reference-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run frozen D3 microphysics gates
        run: python3 tests/test_sidmx_d3_reference.py
      - name: Install M11 IC generator dependencies
        run: python3 -m pip install --disable-pip-version-check numpy scipy
      - name: Generate deterministic M11 smoke IC twice
        run: |
          python3 d3/phase141_generate_m11_ic.py --n-total 200 --seed 126001 --taper 0.05 --output /tmp/M11_a.dat
          python3 d3/phase141_generate_m11_ic.py --n-total 200 --seed 126001 --taper 0.05 --output /tmp/M11_b.dat
          cmp /tmp/M11_a.dat /tmp/M11_b.dat
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/M11_a.dat.json'))
          assert a['n_H']==a['n_L']==100
          assert abs(a['mass_ratio']-3.0)<1e-12
          assert a['M200_Msun']==1.0e11
          assert abs(a['rho_s_Msun_kpc3']-6.89e6)<1e-6
          assert abs(a['r_s_kpc']-9.1)<1e-12
          print('M11 deterministic IC smoke gate PASS',a['snapshot_sha256'])
          PY

  gizmo-d3-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GIZMO build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential openmpi-bin libopenmpi-dev libgsl-dev libhdf5-openmpi-dev libfftw3-dev
          python3 -m pip install --disable-pip-version-check numpy scipy
      - name: Select Ubuntu-compatible GIZMO toolchain
        run: |
          sed -i 's/^SYSTYPE="Frontera"/SYSTYPE="PopOS"/' Makefile.systype
          cp d3/Config_d3_ci.sh Config.sh
      - name: Build D3-enabled GIZMO
        run: make -j2 CONFIG=Config.sh EXEC=GIZMO_D3
      - name: Run a real live-gravity SIDMx M11 smoke evolution
        shell: bash
        run: |
          set -euo pipefail
          python3 d3/phase141_generate_m11_ic.py --n-total 4000 --seed 126001 --taper 0.05 --output /tmp/M11_live.dat
          mkdir -p /tmp/d3_smoke_out
          sed -e 's|@IC@|/tmp/M11_live.dat|g' \
              -e 's|@OUT@|/tmp/d3_smoke_out|g' \
              -e 's|@MODE@|-2|g' \
              d3/params_m11_smoke.template > /tmp/d3_smoke.params
          ./GIZMO_D3 /tmp/d3_smoke.params 0 2>&1 | tee /tmp/d3_smoke.log
          test -s /tmp/d3_smoke.log
          grep -q 'SIDMx-D3 init PASS: mode=2' /tmp/d3_smoke.log
          grep -q 'Final time=0.0001 reached. Simulation ends.' /tmp/d3_smoke.log
          ! grep -q 'MPI_ABORT' /tmp/d3_smoke.log
          ! grep -q 'ENDRUN issued' /tmp/d3_smoke.log
          test -n "$(find /tmp/d3_smoke_out -type f -print -quit)"
      - name: Commission live HL collision rate and pair conservation
        shell: bash
        run: |
          set -euo pipefail
          python3 d3/generate_d3_collision_cloud.py \
            --n-total 1000 --seed 177001 --radius-kpc 1.0 \
            --total-mass-msun 1.0e10 --stream-speed-kms 100 \
            --output /tmp/D3_collision_cloud.dat
          mkdir -p /tmp/d3_collision_out
          sed -e 's|@IC@|/tmp/D3_collision_cloud.dat|g' \
              -e 's|@OUT@|/tmp/d3_collision_out|g' \
              -e 's|@MODE@|-2|g' \
              -e 's|TimeOfFirstSnapshot         0.00010|TimeOfFirstSnapshot         0.00005|' \
              -e 's|TimeMax                      0.00010|TimeMax                      0.00005|' \
              -e 's|MaxSizeTimestep              0.00002|MaxSizeTimestep              0.00001|' \
              -e 's|BoxSize                      2000.0|BoxSize                      20.0|' \
              d3/params_m11_smoke.template > /tmp/d3_collision.params
          ./GIZMO_D3 /tmp/d3_collision.params 0 2>&1 | tee /tmp/d3_collision.log
          grep -q 'SIDMx-D3 init PASS: mode=2' /tmp/d3_collision.log
          grep -q 'SIDMx-D3 AUDIT' /tmp/d3_collision.log
          ! grep -q 'MPI_ABORT' /tmp/d3_collision.log
          ! grep -q 'ENDRUN issued' /tmp/d3_collision.log
          python3 d3/check_d3_live_audit.py /tmp/d3_collision.log \
            --mode 2 --signal-channel HL --min-expected 2 \
            --max-probability 0.2 --max-conservation-residual 1e-12 \
            --forbid-events HH LL | tee /tmp/d3_collision_audit.json
      - name: Record executable checksum
        run: |
          test -x GIZMO_D3
          sha256sum GIZMO_D3 | tee GIZMO_D3.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: gizmo-d3-build
          path: |
            GIZMO_D3
            GIZMO_D3.sha256
            GIZMO_config.h
            /tmp/d3_smoke.log
            /tmp/d3_smoke.params
            /tmp/M11_live.dat.json
            /tmp/d3_collision.log
            /tmp/d3_collision.params
            /tmp/d3_collision_audit.json
            /tmp/D3_collision_cloud.dat.json
          if-no-files-found: error
