name: D3 SIDMx GIZMO validation

on:
  push:
    branches: [master, d3-sidmx-gizmo, d3-live-smoke-real-fix, d3-exact-bernoulli-gate2, d3-phase165-production-lock]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: d3-sidmx-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  d3-reference-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run frozen D3 microphysics gates
        run: |
          python3 tests/test_sidmx_d3_reference.py
          python3 tests/test_phase165_equal_label_control.py
      - name: Install M11 IC generator dependencies
        run: python3 -m pip install --disable-pip-version-check numpy scipy
      - name: Generate deterministic M11 smoke IC twice
        run: |
          python3 d3/phase141_generate_m11_ic.py --n-total 200 --seed 126001 --taper 0.05 --output /tmp/M11_a.dat
          python3 d3/phase141_generate_m11_ic.py --n-total 200 --seed 126001 --taper 0.05 --output /tmp/M11_b.dat
          cmp /tmp/M11_a.dat /tmp/M11_b.dat
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/M11_a.dat.json'))
          assert a['n_H']==a['n_L']==100
          assert abs(a['mass_ratio']-3.0)<1e-12
          assert a['M200_Msun']==1.0e11
          assert abs(a['rho_s_Msun_kpc3']-6.89e6)<1e-6
          assert abs(a['r_s_kpc']-9.1)<1e-12
          print('M11 deterministic IC smoke gate PASS',a['snapshot_sha256'])
          PY
      - name: Generate Phase165 equal-label and permutation IC adapters
        run: |
          python3 d3/production/generate_phase165_ic.py \
            --n-total 200 --seed 165051 --mass-ratio 1 \
            --output /tmp/M11_equal.dat
          python3 d3/production/generate_phase165_ic.py \
            --n-total 200 --seed 165071 --mass-ratio 3 \
            --output /tmp/M11_order_a.dat
          python3 d3/production/generate_phase165_ic.py \
            --n-total 200 --seed 165071 --mass-ratio 3 \
            --permute-within-species --permutation-seed 10165071 \
            --output /tmp/M11_order_b.dat
          python3 - <<'PY'
          import json
          e=json.load(open('/tmp/M11_equal.dat.json'))
          a=json.load(open('/tmp/M11_order_a.dat.json'))
          b=json.load(open('/tmp/M11_order_b.dat.json'))
          assert abs(e['mass_ratio']-1.0)<1e-12
          assert abs(a['mass_ratio']-3.0)<1e-12
          assert abs(b['mass_ratio']-3.0)<1e-12
          assert not a['permuted_within_species']
          assert b['permuted_within_species']
          assert a['snapshot_sha256'] != b['snapshot_sha256']
          print('Phase165 IC adapter gates PASS')
          PY

  gizmo-d3-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GIZMO build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential openmpi-bin libopenmpi-dev libgsl-dev libhdf5-openmpi-dev libfftw3-dev
          python3 -m pip install --disable-pip-version-check numpy scipy
      - name: Select Ubuntu-compatible GIZMO toolchain
        run: |
          sed -i 's/^SYSTYPE="Frontera"/SYSTYPE="PopOS"/' Makefile.systype
          cp d3/Config_d3_ci.sh Config.sh
      - name: Build D3-enabled GIZMO
        run: make -j2 CONFIG=Config.sh EXEC=GIZMO_D3
      - name: Run a real live-gravity SIDMx M11 smoke evolution
        shell: bash
        run: |
          set -euo pipefail
          python3 d3/phase141_generate_m11_ic.py --n-total 4000 --seed 126001 --taper 0.05 --output /tmp/M11_live.dat
          mkdir -p /tmp/d3_smoke_out
          sed -e 's|@IC@|/tmp/M11_live.dat|g' \
              -e 's|@OUT@|/tmp/d3_smoke_out|g' \
              -e 's|@MODE@|-2|g' \
              d3/params_m11_smoke.template > /tmp/d3_smoke.params
          ./GIZMO_D3 /tmp/d3_smoke.params 0 2>&1 | tee /tmp/d3_smoke.log
          grep -q 'SIDMx-D3 init PASS: mode=2' /tmp/d3_smoke.log
          grep -q 'Final time=0.0001 reached. Simulation ends.' /tmp/d3_smoke.log
          ! grep -q 'MPI_ABORT' /tmp/d3_smoke.log
          ! grep -q 'ENDRUN issued' /tmp/d3_smoke.log
          test -n "$(find /tmp/d3_smoke_out -type f -print -quit)"
      - name: Commission live HL collision rate and pair conservation
        shell: bash
        run: |
          set -euo pipefail
          python3 d3/generate_d3_collision_cloud.py \
            --n-total 1000 --seed 177001 --radius-kpc 1.0 \
            --total-mass-msun 1.0e10 --stream-speed-kms 100 \
            --output /tmp/D3_collision_cloud.dat
          mkdir -p /tmp/d3_collision_out
          sed -e 's|@IC@|/tmp/D3_collision_cloud.dat|g' \
              -e 's|@OUT@|/tmp/d3_collision_out|g' \
              -e 's|@MODE@|-2|g' \
              -e 's|TimeOfFirstSnapshot         0.00010|TimeOfFirstSnapshot         0.00005|' \
              -e 's|TimeMax                      0.00010|TimeMax                      0.00005|' \
              -e 's|MaxSizeTimestep              0.00002|MaxSizeTimestep              0.00001|' \
              -e 's|BoxSize                      2000.0|BoxSize                      20.0|' \
              d3/params_m11_smoke.template > /tmp/d3_collision.params
          ./GIZMO_D3 /tmp/d3_collision.params 0 2>&1 | tee /tmp/d3_collision.log
          grep -q 'SIDMx-D3 init PASS: mode=2' /tmp/d3_collision.log
          grep -q 'SIDMx-D3 AUDIT' /tmp/d3_collision.log
          ! grep -q 'MPI_ABORT' /tmp/d3_collision.log
          ! grep -q 'ENDRUN issued' /tmp/d3_collision.log
          python3 d3/check_d3_live_audit.py /tmp/d3_collision.log \
            --mode 2 --signal-channels HL --min-expected 2 \
            --forbid-channels HH LL --max-probability 0.2 \
            --max-conservation-residual 1e-12 | tee /tmp/d3_collision_audit.json
      - name: Commission equal-label hostile control
        shell: bash
        run: |
          set -euo pipefail
          python3 d3/generate_d3_collision_cloud.py \
            --n-total 1000 --seed 177010 --radius-kpc 1.0 \
            --total-mass-msun 1.0e10 --mass-ratio 1 \
            --stream-speed-kms 200 --output /tmp/D3_equal_cloud.dat
          mkdir -p /tmp/d3_equal_out
          sed -e 's|@IC@|/tmp/D3_equal_cloud.dat|g' \
              -e 's|@OUT@|/tmp/d3_equal_out|g' \
              -e 's|@MODE@|-10|g' \
              -e 's|MaxSizeTimestep              0.00002|MaxSizeTimestep              0.00001|' \
              -e 's|BoxSize                      2000.0|BoxSize                      20.0|' \
              d3/params_m11_smoke.template > /tmp/d3_equal.params
          ./GIZMO_D3 /tmp/d3_equal.params 0 2>&1 | tee /tmp/d3_equal.log
          grep -q 'SIDMx-D3 init PASS: mode=10' /tmp/d3_equal.log
          grep -q 'SIDMx-D3 AUDIT' /tmp/d3_equal.log
          ! grep -q 'MPI_ABORT' /tmp/d3_equal.log
          ! grep -q 'ENDRUN issued' /tmp/d3_equal.log
          python3 d3/check_d3_live_audit.py /tmp/d3_equal.log \
            --mode 10 --signal-channels HL --min-expected 2 \
            --forbid-channels HH LL --max-probability 0.2 \
            --max-conservation-residual 1e-12 | tee /tmp/d3_equal_audit.json
      - name: Commission D3 runtime mode matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 d3/generate_d3_collision_cloud.py \
            --n-total 1000 --seed 177002 --radius-kpc 1.0 \
            --total-mass-msun 1.0e11 --stream-speed-kms 100 \
            --dispersion-kms 100 --output /tmp/D3_matrix_cloud.dat

          make_params () {
            local sentinel="$1" outdir="$2" outfile="$3"
            mkdir -p "$outdir"
            sed -e 's|@IC@|/tmp/D3_matrix_cloud.dat|g' \
                -e "s|@OUT@|${outdir}|g" \
                -e "s|@MODE@|${sentinel}|g" \
                -e 's|TimeOfFirstSnapshot         0.00010|TimeOfFirstSnapshot         0.00004|' \
                -e 's|TimeMax                      0.00010|TimeMax                      0.00004|' \
                -e 's|MaxSizeTimestep              0.00002|MaxSizeTimestep              0.000004|' \
                -e 's|BoxSize                      2000.0|BoxSize                      20.0|' \
                d3/params_m11_smoke.template > "$outfile"
          }

          make_params -9 /tmp/d3_null_out /tmp/d3_null.params
          ./GIZMO_D3 /tmp/d3_null.params 0 2>&1 | tee /tmp/d3_null.log
          grep -q 'SIDMx-D3 init PASS: mode=9' /tmp/d3_null.log
          python3 d3/check_d3_live_audit.py /tmp/d3_null.log \
            --mode 9 --expect-null --max-probability 0.2 \
            --max-conservation-residual 1e-12 | tee /tmp/d3_null_audit.json

          make_params -3 /tmp/d3_hloff_out /tmp/d3_hloff.params
          ./GIZMO_D3 /tmp/d3_hloff.params 0 2>&1 | tee /tmp/d3_hloff.log
          grep -q 'SIDMx-D3 init PASS: mode=3' /tmp/d3_hloff.log
          python3 d3/check_d3_live_audit.py /tmp/d3_hloff.log \
            --mode 3 --signal-channels HH LL --min-expected 2 \
            --forbid-channels HL --max-probability 0.2 \
            --max-conservation-residual 1e-12 | tee /tmp/d3_hloff_audit.json

          make_params -1 /tmp/d3_full_out /tmp/d3_full.params
          ./GIZMO_D3 /tmp/d3_full.params 0 2>&1 | tee /tmp/d3_full.log
          grep -q 'SIDMx-D3 init PASS: mode=1' /tmp/d3_full.log
          python3 d3/check_d3_live_audit.py /tmp/d3_full.log \
            --mode 1 --signal-channels HH LL HL --min-expected 2 \
            --max-probability 0.2 --max-conservation-residual 1e-12 \
            | tee /tmp/d3_full_audit.json
      - name: Record executable checksum
        run: |
          test -x GIZMO_D3
          sha256sum GIZMO_D3 | tee GIZMO_D3.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: gizmo-d3-build
          path: |
            GIZMO_D3
            GIZMO_D3.sha256
            GIZMO_config.h
            /tmp/d3_smoke.log
            /tmp/d3_smoke.params
            /tmp/M11_live.dat.json
            /tmp/d3_collision.log
            /tmp/d3_collision.params
            /tmp/d3_collision_audit.json
            /tmp/D3_collision_cloud.dat.json
            /tmp/d3_equal.log
            /tmp/d3_equal.params
            /tmp/d3_equal_audit.json
            /tmp/D3_equal_cloud.dat.json
            /tmp/d3_null.log
            /tmp/d3_null_audit.json
            /tmp/d3_hloff.log
            /tmp/d3_hloff_audit.json
            /tmp/d3_full.log
            /tmp/d3_full_audit.json
            /tmp/D3_matrix_cloud.dat.json
          if-no-files-found: error
