name: D3 Phase185 final campaign verdict

on:
  push:
    branches: [master, phase185-final-verdict-package, phase186-claim-completeness-gate, phase187-fatal-gate-evaluators]
    paths:
      - 'd3/production/phase185_final_verdict.py'
      - 'd3/production/phase186_claim_completeness.py'
      - 'd3/production/phase187_fatal_gate_validator.py'
      - 'd3/production/phase187_scalar_evidence.py'
      - 'd3/production/phase187_energy_probe.py'
      - 'tests/test_phase185_final_verdict.py'
      - 'tests/test_phase186_claim_completeness.py'
      - 'tests/test_phase187_fatal_gate_validator.py'
      - '.github/workflows/d3-phase185-final-verdict.yml'
  pull_request:
    branches: [master]
    paths:
      - 'd3/production/phase185_final_verdict.py'
      - 'd3/production/phase186_claim_completeness.py'
      - 'd3/production/phase187_fatal_gate_validator.py'
      - 'd3/production/phase187_scalar_evidence.py'
      - 'd3/production/phase187_energy_probe.py'
      - 'tests/test_phase185_final_verdict.py'
      - 'tests/test_phase186_claim_completeness.py'
      - 'tests/test_phase187_fatal_gate_validator.py'
      - '.github/workflows/d3-phase185-final-verdict.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-verdict-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install analysis dependency
        run: python3 -m pip install --disable-pip-version-check numpy
      - name: Compile complete verdict stack
        run: |
          python3 -m py_compile d3/production/phase185_final_verdict.py
          python3 -m py_compile d3/production/phase186_claim_completeness.py
          python3 -m py_compile d3/production/phase187_fatal_gate_validator.py
          python3 -m py_compile d3/production/phase187_scalar_evidence.py
          python3 -m py_compile d3/production/phase187_energy_probe.py
      - name: Run Phase185 atomic verdict tests
        run: python3 tests/test_phase185_final_verdict.py
      - name: Run Phase186 completeness tests
        run: python3 tests/test_phase186_claim_completeness.py
      - name: Run Phase187 fatal-gate tests
        run: python3 tests/test_phase187_fatal_gate_validator.py
