name: Phase 178 D3 GIZMO Build + Live Box

on:
  push:
    branches: [phase178-d3-live]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-d3:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential patch perl openmpi-bin libopenmpi-dev libgsl-dev libhdf5-openmpi-dev libfftw3-dev python3-numpy python3-h5py
      - name: Apply frozen D3 patch
        run: |
          set -euxo pipefail
          cat phase178/patch.part00 phase178/patch.part01 phase178/patch.part02 phase178/patch.part03 phase178/patch.part04 > /tmp/d3.patch
          echo "da25a979d51430657b18d124714fa7ecbe4c49bee5be937d933b4a8169e12b41  /tmp/d3.patch" | sha256sum -c -
          patch --dry-run --batch --forward --fuzz=3 -p1 < /tmp/d3.patch
          patch --batch --forward --fuzz=3 -p1 < /tmp/d3.patch
          git diff --check
      - name: Math gate
        run: python3 phase178/validate_d3_patch_math.py
      - name: Build D3 GIZMO
        run: |
          sed -i 's/^SYSTYPE="Frontera"/SYSTYPE="PopOS"/' Makefile.systype
          cat > Config.sh <<'EOF'
          DM_SIDM=6
          DM_SIDM_D3_HL
          SIDM_D3_H_TYPE=1
          SIDM_D3_L_TYPE=2
          SIDM_D3_ENABLE_HH=1
          SIDM_D3_ENABLE_LL=1
          SIDM_D3_ENABLE_HL=1
          SIDM_D3_LOG_EVERY_N_STEPS=1
          SIDM_D3_AUDIT_CONSERVATION=1
          PERIODIC
          SELFGRAVITY_OFF
          EOF
          set -o pipefail
          make clean || true
          make -j2 EXEC=GIZMO_D3 2>&1 | tee phase178_build.log
          test -x GIZMO_D3
      - name: Generate deterministic H/L box IC
        run: |
          mkdir -p phase178/live_box/output
          python3 phase178/make_d3_box_ic.py phase178/live_box/box.hdf5 4096
          python3 - <<'PY'
          import h5py, numpy as np
          f=h5py.File('phase178/live_box/box.hdf5','r')
          H=f['PartType1']; L=f['PartType2']
          assert len(H['Masses'])==len(L['Masses'])==4096
          assert np.allclose(H['Masses'][:]/L['Masses'][:],3.0)
          print('IC_GATE=PASS N_H=N_L=4096 mH/mL=3')
          PY
      - name: Run live two-species GIZMO box
        run: |
          cat > phase178/live_box/params.txt <<'EOF'
          InitCondFile phase178/live_box/box
          OutputDir phase178/live_box/output
          ICFormat 3
          SnapFormat 3
          SnapshotFileBase snapshot
          OutputListOn 0
          NumFilesPerSnapshot 1
          NumFilesWrittenInParallel 1
          TimeBegin 0
          TimeMax 0.02
          TimeOfFirstSnapshot 0.02
          TimeBetSnapshot 0.02
          TimeLimitCPU 1200
          CpuTimeBetRestartFile 1200
          MaxMemSize 1800
          PartAllocFactor 5.0
          BufferSize 100
          MaxSizeTimestep 0.0002
          MinSizeTimestep 1.0e-12
          UnitLength_in_cm 3.085678e21
          UnitMass_in_g 1.989e43
          UnitVelocity_in_cm_per_s 1.0e5
          GravityConstantInternal 0
          ComovingIntegrationOn 0
          BoxSize 100.0
          HubbleParam 1.0
          AGS_DesNumNgb 64
          Softening_Type1 1.0
          Softening_Type2 1.0
          DM_InteractionCrossSection 1
          DM_InteractionVelocityScale 0
          DM_DissipationFactor 0
          DM_KickPerCollision 0
          EOF
          set -o pipefail
          timeout 900 mpirun --allow-run-as-root --oversubscribe -np 2 ./GIZMO_D3 phase178/live_box/params.txt 2>&1 | tee phase178/live_box/run.log
          test -s phase178/live_box/output/sidm_d3_audit.log
          cat phase178/live_box/output/sidm_d3_audit.log
      - name: Audit live event counters
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('phase178/live_box/output/sidm_d3_audit.log')
          rows=[]
          for line in p.read_text().splitlines():
              if not line.strip() or line.startswith('#'): continue
              x=line.split(); rows.append(x)
          assert rows, 'no D3 audit rows'
          ev=[sum(int(r[i]) for r in rows) for i in (2,3,4)]
          p02=[sum(int(r[i]) for r in rows) for i in (5,6,7)]
          p1=[sum(int(r[i]) for r in rows) for i in (8,9,10)]
          maxbad=[max(float(r[i]) for r in rows) for i in (11,12,13)]
          mom=max(float(r[14]) for r in rows); egy=max(float(r[15]) for r in rows)
          print('LIVE_EVENTS_HH_LL_HL=',ev)
          print('P_GT_0.2=',p02,'P_GE_1=',p1,'MAX_BAD_P=',maxbad)
          print('MAX_MOM_RES=',mom,'MAX_ENERGY_RES=',egy)
          assert sum(ev)>0, 'live GIZMO produced zero D3 events'
          assert sum(p1)==0, 'probability >=1 encountered'
          assert mom < 1e-10 and egy < 1e-10, (mom,egy)
          Path('phase178/live_box/LIVE_BOX_PASS.txt').write_text(f'PASS events={ev} p02={p02} p1={p1} maxbad={maxbad} mom={mom} energy={egy}\n')
          print('LIVE_BOX_GATE=PASS')
          PY
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase178-gizmo-d3-live-box
          if-no-files-found: warn
          path: |
            GIZMO_D3
            phase178_build.log
            phase178/validate_d3_patch_math_results.json
            phase178/live_box/
